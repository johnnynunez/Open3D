name: Retained exact-source ARM64 wheel diagnosis
on:
  push:
    branches: [hermes-ci/open3d-tests-followup-f47d260]
permissions:
  contents: read
  actions: read
jobs:
  retained-wheel:
    runs-on: windows-11-arm
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: source
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          sparse-checkout: .github/followup
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: mayankag-qti/Open3D
          ref: f47d260b2074d56d00e7a68eeabebd5bd45ad812
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Verify parent build gates, retained artifact and exact source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force evidence | Out-Null
          python ../harness/.github/followup/verify_parent.py
          if ($LASTEXITCODE -ne 0) { throw 'Parent provenance failed' }
      - uses: actions/download-artifact@v4
        with:
          repository: johnnynunez/Open3D
          run-id: 38180281801
          artifact-ids: '11718448636'
          path: source/wheel
          github-token: ${{ github.token }}
      - name: Audit unchanged retained wheel
        run: |
          $ErrorActionPreference='Stop'
          $w=@(Get-ChildItem wheel -Recurse -Filter *.whl)
          if ($w.Count -ne 1) { throw 'Expected one retained wheel' }
          if ((Get-FileHash $w[0].FullName -Algorithm SHA256).Hash.ToLower() -ne '38b1509f3df219dfe4fbc66c33c3d39c855ae51079df347fc94d255bc2f1c7f7') { throw 'Wheel digest changed' }
          python ../harness/.github/followup/wheel_audit.py $w[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Wheel PE/RECORD audit failed' }
          Copy-Item wheel-audit-independent.json evidence/
      - name: Install unchanged wheel in fresh native CPython environment
        id: install
        run: |
          $ErrorActionPreference='Stop'
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw 'venv failed' }
          'torch===0' | Set-Content forbid-torch.txt
          $w=(Get-ChildItem wheel -Recurse -Filter *.whl).FullName
          ./.venv/Scripts/python -m pip install pip==24.3.1
          if ($LASTEXITCODE -ne 0) { throw 'pip failed' }
          ./.venv/Scripts/python -m pip install --only-binary=:all: -c forbid-torch.txt -r python/requirements_test.txt $w
          if ($LASTEXITCODE -ne 0) { throw 'install failed' }
          ./.venv/Scripts/python -m pip list --format=json | Set-Content evidence/installed.json
          ./.venv/Scripts/python -c "import importlib.util,sysconfig,open3d; assert sysconfig.get_platform()=='win-arm64'; assert importlib.util.find_spec('torch') is None; assert not open3d._build_config['BUILD_PYTORCH_OPS']; print(open3d.__version__,open3d.__file__,open3d._build_config)"
          if ($LASTEXITCODE -ne 0) { throw 'Native import failed' }
      - name: Reproduce unchanged colored ICP fixture through bindings
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          ./.venv/Scripts/python ../harness/.github/followup/probe_icp.py 2>&1 | Tee-Object evidence/probe.log
          if ($LASTEXITCODE -ne 0) { throw 'Original fixture reproduction failed; diagnostic variants do not waive failure' }
      - name: Run unchanged upstream Python suite without installed Torch
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          ./.venv/Scripts/python -m pytest python/test/ --randomly-seed=20261011 --junitxml=evidence/python-tests.xml 2>&1 | Tee-Object evidence/python-tests.log
          if ($LASTEXITCODE -ne 0) { throw 'Upstream Python tests failed' }
      - name: Verify source remains unchanged
        if: ${{ always() }}
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Tracked source changed' }
          git status --porcelain | Set-Content evidence/source-status.txt
          Get-ChildItem evidence -Recurse -File | Get-FileHash -Algorithm SHA256 | ConvertTo-Json -Depth 5 | Set-Content evidence/files-sha256.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: retained-wheel-diagnosis
          path: ${{ github.workspace }}/source/evidence/
          if-no-files-found: error
          retention-days: 14
