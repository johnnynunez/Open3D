name: Exact-source Windows ARM64 validation
'on':
  push:
    branches:
    - hermes-ci/windows-arm64-f47d260b2074
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-arm64:
    name: Build ARM64
    permissions:
      contents: read
    runs-on: windows-11-arm
    strategy:
      fail-fast: false
      matrix:
        CONFIG:
        - Release
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
      with:
        repository: mayankag-qti/Open3D
        ref: f47d260b2074d56d00e7a68eeabebd5bd45ad812
        persist-credentials: false
    - name: Verify exact public PR source SHA
      shell: pwsh
      env:
        EXPECTED_SOURCE_SHA: f47d260b2074d56d00e7a68eeabebd5bd45ad812
        SOURCE_REPOSITORY: mayankag-qti/Open3D
      run: '$actual = (git rev-parse HEAD).Trim()

        if ($LASTEXITCODE -ne 0 -or $actual -ne $env:EXPECTED_SOURCE_SHA) { throw "Unexpected source revision: $actual" }

        @{ source_sha=$actual; source_repository=$env:SOURCE_REPOSITORY; ci_sha=$env:GITHUB_SHA; runner_arch=$env:RUNNER_ARCH
        } | ConvertTo-Json | Set-Content provenance.json

        '
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        architecture: arm64
    - name: Install Python build requirements
      shell: pwsh
      run: "$ErrorActionPreference = 'Stop'\npython -m pip install -U pip\nif ($LASTEXITCODE -ne 0) { throw \"pip self-upgrade\
        \ failed.\" }\npython -m pip install -r python/requirements.txt `\n  -r python/requirements_build.txt\nif ($LASTEXITCODE\
        \ -ne 0) { throw \"Requirements install failed.\" }\n"
    - name: Generate vcpkg baseline
      shell: pwsh
      run: "$ErrorActionPreference = 'Stop'\n$vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT\nif (-not $vcpkgRoot) { throw \"VCPKG_INSTALLATION_ROOT\
        \ is not set.\" }\n$baseline = (git -C \"$vcpkgRoot\" rev-parse HEAD).Trim()\nif (-not $baseline) { throw \"Could\
        \ not read vcpkg baseline from $vcpkgRoot\" }\nWrite-Host \"vcpkg baseline = $baseline\"\n$config = @{\n  'default-registry'\
        \ = @{\n    kind       = 'git'\n    repository = 'https://github.com/microsoft/vcpkg'\n    baseline   = $baseline\n\
        \  }\n} | ConvertTo-Json -Depth 10\n$config | Out-File -FilePath 'vcpkg-configuration.json' -Encoding ascii\n"
    - name: Detect Visual Studio generator
      shell: pwsh
      run: "$ErrorActionPreference = 'Stop'\n$vswhere = Join-Path ${env:ProgramFiles(x86)} `\n  'Microsoft Visual Studio\\\
        Installer\\vswhere.exe'\nif (-not (Test-Path $vswhere)) { throw \"vswhere.exe not found at $vswhere\" }\n\n$version\
        \ = & $vswhere -latest -products * -property installationVersion\nif (-not $version) { throw \"No Visual Studio installation\
        \ found.\" }\n\n$major = [int]($version.Split('.')[0])\nswitch ($major) {\n  17      { $generator = 'Visual Studio\
        \ 17 2022' }\n  18      { $generator = 'Visual Studio 18 2026' }\n  default { throw \"Unsupported Visual Studio major\
        \ version: $major\" }\n}\n\nWrite-Host \"Detected VS $version -> generator '$generator'\"\n\"CMAKE_GENERATOR_NAME=$generator\"\
        \ |\n  Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8\n"
    - name: Config
      shell: pwsh
      run: "$ErrorActionPreference = 'Stop'\nNew-Item -Path '${{ env.BUILD_DIR }}' -ItemType Directory -Force | Out-Null\n\
        $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT\nif (-not $vcpkgRoot) { throw \"VCPKG_INSTALLATION_ROOT is not set.\" }\n\
        $toolchain = Join-Path $vcpkgRoot 'scripts\\buildsystems\\vcpkg.cmake'\ncmake -S . -B '${{ env.BUILD_DIR }}' -G \"\
        $env:CMAKE_GENERATOR_NAME\" -A ARM64 `\n  -DCMAKE_TOOLCHAIN_FILE=\"$toolchain\" `\n  -DVCPKG_TARGET_TRIPLET=arm64-windows-static-md\
        \ `\n  -DOPEN3D_USE_VCPKG=ON `\n  -DVCPKG_MANIFEST_FEATURES=\"tests;minizip\" `\n  -DWITH_MINIZIP=ON `\n  -DBUILD_SHARED_LIBS=ON\
        \ `\n  -DSTATIC_WINDOWS_RUNTIME=OFF `\n  -DBUILD_UNIT_TESTS=ON `\n  -DBUILD_PYTHON_MODULE=ON `\n  -DIGNORE_STUBGEN_ERRORS=ON\
        \ `\n  -DBUILD_JUPYTER_EXTENSION=OFF `\n  -DBUILD_GUI=OFF `\n  -DBUILD_EXAMPLES=OFF `\n  -DBUILD_ISPC_MODULE=OFF `\n\
        \  -DBUILD_CUDA_MODULE=OFF `\n  -DBUILD_SYCL_MODULE=OFF `\n  -DBUILD_PYTORCH_OPS=OFF `\n  -DBUILD_AZURE_KINECT=OFF\
        \ `\n  -DBUILD_LIBREALSENSE=OFF `\n  -DBUILD_WEBRTC=OFF `\n  -DPython3_EXECUTABLE=$((Get-Command python).Source) `\n\
        \  -DCMAKE_BUILD_TYPE=${{ matrix.CONFIG }}\n\nif ($LASTEXITCODE -ne 0) { throw \"CMake configure failed\" }\n"
    - name: Build
      working-directory: ${{ env.BUILD_DIR }}
      shell: pwsh
      run: '$ErrorActionPreference = ''Stop''

        cmake --build . --parallel ${{ env.NPROC }} --config ${{ matrix.CONFIG }} --target tests


        if ($LASTEXITCODE -ne 0) { throw "C++ build failed" }

        '
    - name: Build Python wheel
      working-directory: ${{ env.BUILD_DIR }}
      shell: pwsh
      run: "$ErrorActionPreference = 'Stop'\ncmake --build . --parallel ${{ env.NPROC }} --config ${{ matrix.CONFIG }} --target\
        \ pip-package\nif ($LASTEXITCODE -ne 0) { throw \"pip-package build failed.\" }\n$whl = Get-ChildItem \"lib/python_package/pip_package/open3d*.whl\"\
        \ |\n  Select-Object -First 1\nif (-not $whl) { throw \"Wheel not found after pip-package build.\" }\nWrite-Host \"\
        Built wheel: $($whl.Name)\"\n"
    - name: Verify native Python, wheel PE payloads and RECORD
      shell: python
      run: "import base64,csv,hashlib,io,json,pathlib,struct,sys,sysconfig,zipfile\nassert sysconfig.get_platform() == 'win-arm64',\
        \ sysconfig.get_platform()\ndef machine(b):\n    assert b[:2] == b'MZ'\n    p=struct.unpack_from('<I', b, 0x3c)[0]\n\
        \    assert b[p:p+4] == b'PE\\0\\0'\n    return struct.unpack_from('<H',b,p+4)[0]\nassert machine(pathlib.Path(sys.executable).read_bytes())\
        \ == 0xaa64\nroots=[r'C:\\Open3D\\build\\lib\\python_package\\pip_package']\nwheels=sorted({p for r in roots for p\
        \ in pathlib.Path(r).glob('*.whl')})\nassert wheels, roots\nresult=[]\nfor path in wheels:\n    assert 'win_arm64'\
        \ in path.name, path.name\n    with zipfile.ZipFile(path) as z:\n        records=[n for n in z.namelist() if n.endswith('.dist-info/RECORD')]\n\
        \        assert len(records)==1\n        count=0\n        for n,h,size in csv.reader(io.StringIO(z.read(records[0]).decode())):\n\
        \            if h:\n                alg,want=h.split('=',1)\n                b=z.read(n)\n                assert base64.urlsafe_b64encode(hashlib.new(alg,b).digest()).rstrip(b'=').decode()==want,n\n\
        \                assert len(b)==int(size),n\n                count+=1\n        natives={n:hex(machine(z.read(n)))\
        \ for n in z.namelist() if n.lower().endswith(('.pyd','.dll'))}\n        assert natives and all(x=='0xaa64' for x\
        \ in natives.values()),natives\n        result.append({'wheel':path.name,'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),'record_verified':count,'native':natives})\n\
        pathlib.Path('wheel-audit.json').write_text(json.dumps(result,indent=2))\nprint(json.dumps(result,indent=2))\n"
    - name: Run C++ unit tests
      working-directory: ${{ env.BUILD_DIR }}
      shell: pwsh
      run: '$ErrorActionPreference = ''Stop''

        Write-Host "Add --gtest_random_seed=SEED to the test command to repeat this test sequence."

        & ".\bin\${{ matrix.CONFIG }}\tests.exe" --gtest_shuffle --gtest_output=xml:cpp-tests.xml


        if ($LASTEXITCODE -ne 0) { throw "C++ tests failed" }

        '
    - name: Upload ARM64 wheel
      if: ${{ always() && !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: open3d-wheel-arm64-${{ matrix.CONFIG }}
        path: ${{ env.BUILD_DIR }}/lib/python_package/pip_package/open3d*.whl
        if-no-files-found: warn
    - name: Upload open3d-build-evidence
      uses: actions/upload-artifact@v4
      with:
        name: open3d-build-evidence
        path: 'provenance.json

          wheel-audit.json

          ${{ env.BUILD_DIR }}/cpp-tests.xml

          ${{ env.BUILD_DIR }}/CMakeCache.txt

          ${{ env.BUILD_DIR }}/CMakeFiles/CMakeConfigureLog.yaml'
        if-no-files-found: warn
        retention-days: 14
      if: ${{ always() }}
    timeout-minutes: 90
  test-wheel-arm64:
    name: Test wheel ARM64
    permissions:
      contents: read
    runs-on: windows-11-arm
    needs:
    - build-arm64
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
      with:
        repository: mayankag-qti/Open3D
        ref: f47d260b2074d56d00e7a68eeabebd5bd45ad812
        persist-credentials: false
    - name: Verify exact public PR source SHA
      shell: pwsh
      env:
        EXPECTED_SOURCE_SHA: f47d260b2074d56d00e7a68eeabebd5bd45ad812
        SOURCE_REPOSITORY: mayankag-qti/Open3D
      run: '$actual = (git rev-parse HEAD).Trim()

        if ($LASTEXITCODE -ne 0 -or $actual -ne $env:EXPECTED_SOURCE_SHA) { throw "Unexpected source revision: $actual" }

        @{ source_sha=$actual; source_repository=$env:SOURCE_REPOSITORY; ci_sha=$env:GITHUB_SHA; runner_arch=$env:RUNNER_ARCH
        } | ConvertTo-Json | Set-Content provenance.json

        '
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        architecture: arm64
    - name: Download ARM64 wheel
      uses: actions/download-artifact@v4
      with:
        name: open3d-wheel-arm64-Release
        path: wheel
    - name: Test Python package
      shell: pwsh
      run: '$ErrorActionPreference = ''Stop''

        python -m venv open3d_test_venv

        if ($LASTEXITCODE -ne 0) { throw "venv creation failed." }


        . .\open3d_test_venv\Scripts\Activate.ps1


        python -m pip install -U pip==${{ env.PIP_VER }}

        if ($LASTEXITCODE -ne 0) { deactivate; throw "pip pin failed." }


        python -m pip install -U -r python/requirements_test.txt

        if ($LASTEXITCODE -ne 0) { deactivate; throw "test requirements install failed." }


        $whl = (Get-ChildItem wheel\open3d*.whl | Select-Object -First 1).FullName

        if (-not $whl) { deactivate; throw "ARM64 Open3D wheel not found." }


        Write-Host "Installing $whl"

        python -m pip install $whl

        if ($LASTEXITCODE -ne 0) { deactivate; throw "Wheel install failed." }


        python -c "import open3d; print(''Imported:'', open3d.__version__)"

        if ($LASTEXITCODE -ne 0) { deactivate; throw "import open3d failed." }


        python -c "import open3d.core as o3c; print(o3c.Tensor.ones((2, 2)))"

        $exitCode = $LASTEXITCODE

        deactivate

        if ($exitCode -ne 0) { throw "open3d.core smoke test failed." }

        '
    - name: Run Python unit tests
      shell: pwsh
      run: '$ErrorActionPreference = ''Stop''

        . .\open3d_test_venv\Scripts\Activate.ps1

        Write-Host "Add --randomly-seed=SEED to the test command to reproduce test order."

        python -m pytest python/test/ --junitxml=python-tests.xml

        $exitCode = $LASTEXITCODE

        deactivate

        if ($exitCode -ne 0) { throw "Python unit tests failed with exit code $exitCode." }

        '
    - name: Upload open3d-python-evidence
      uses: actions/upload-artifact@v4
      with:
        name: open3d-python-evidence
        path: 'provenance.json

          python-tests.xml'
        if-no-files-found: warn
        retention-days: 14
      if: ${{ always() }}
    timeout-minutes: 30
env:
  PIP_VER: 24.3.1
  BUILD_DIR: C:\Open3D\build
  NPROC: 2
  DEVELOPER_BUILD: 'ON'
